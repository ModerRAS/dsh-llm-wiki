name: DSH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsh-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dsh-bundle:
    name: DSH bundle (typecheck, lint, tests, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Observation regression tests
        run: pnpm exec vitest run test/observation.test.ts

      - name: DSH host tests
        run: pnpm exec vitest run test/dsh

      - name: Build and pack the DSH bundle
        run: pnpm pack:dsh

      - name: Verify the packed bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tgz="build/dsh-llm-wiki-${version}.tgz"
          test -f "$tgz"
          list="$RUNNER_TEMP/bundle-files.txt"
          tar -tzf "$tgz" > "$list"
          grep -qx 'package/package.json' "$list"
          grep -qx 'package/dist/dsh/src/dsh/index.js' "$list"
          extract="$RUNNER_TEMP/dsh-bundle"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$tgz" -C "$extract"
          test "$(node -p "require('$extract/package/package.json').version")" = "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-llm-wiki-bundle
          path: build/dsh-llm-wiki-*.tgz
          if-no-files-found: error
